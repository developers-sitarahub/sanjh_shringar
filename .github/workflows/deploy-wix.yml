# Deploys the storefront to the Wix Headless site on every push to main.
# Needs one repository secret: WIX_API_KEY (a Wix account API key; see DEPLOY.md).
name: Deploy to Wix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Wix CLI
        run: npm ci --no-fund --no-audit

      - name: Build pages from src/
        run: python tools/build.py

      - name: Test the Wix connector
        run: npm test

      - name: Log in to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then echo "::error::Add the WIX_API_KEY repository secret (see DEPLOY.md)"; exit 1; fi
          npx wix login --api-key "$WIX_API_KEY"

      - name: Release to Wix
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="$(printf '%s' "${COMMIT_MSG:-Manual deploy}" | head -n1 | cut -c1-200)"
          npx wix release --version-type minor --comment "${GITHUB_SHA::7} ${MSG}"
